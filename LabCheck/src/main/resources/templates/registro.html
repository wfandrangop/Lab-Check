<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabCheck - Registro de Usuario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
            padding: 40px 20px;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .register-container h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .register-container p.subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #ccc;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-size: 0.95rem;
            transition: border-color 0.3s, box-shadow 0.3s, background-color 0.3s;
            outline: none;
        }

        /* Fix options background color for dark theme */
        .form-group select option {
            background-color: #24243e;
            color: #fff;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .login-link span {
            color: #aaa;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .login-link a:hover {
            color: #a3b8ff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="register-container">
    <h1>🔬 LabCheck</h1>
    <p class="subtitle">Crear una nueva cuenta en el sistema</p>

    <!-- Alert for validation errors or database constraint failures -->
    <div th:if="${error}" class="alert alert-error" th:text="${error}">
        Error al registrar el usuario.
    </div>

    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        
        <div class="form-row">
            <div class="form-group">
                <label for="nombres">Nombres</label>
                <input type="text" id="nombres" th:field="*{nombres}" 
                       placeholder="Ej. Juan Carlos" required>
            </div>
            <div class="form-group">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" th:field="*{apellidos}" 
                       placeholder="Ej. Pérez Gómez" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="cedula">Cédula</label>
                <input type="text" id="cedula" th:field="*{cedula}" 
                       placeholder="Ej. 1723456789" required>
            </div>
            <div class="form-group">
                <label for="role">Tipo de Usuario</label>
                <select id="role" th:field="*{role}" required>
                    <option value="" disabled selected>Seleccione su rol</option>
                    <option value="ESTUDIANTE">Estudiante</option>
                    <option value="PROFESOR">Profesor</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="correoInst">Correo Institucional</label>
            <input type="email" id="correoInst" th:field="*{correoInst}" 
                   placeholder="ejemplo@uce.edu.ec" required>
        </div>

        <div class="form-group">
            <label for="contrasenia">Contraseña</label>
            <input type="password" id="contrasenia" th:field="*{contrasenia}" 
                   placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>

        <button type="submit" class="btn-register">Registrarse</button>
    </form>

    <div class="login-link">
        <span>¿Ya tienes una cuenta? </span>
        <a th:href="@{/login}">Inicia sesión aquí</a>
    </div>
</div>
</body>
</html>
