<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabCheck - Error</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
        }
        .error-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 500px;
            text-align: center;
        }
        .error-container .icon { font-size: 4rem; margin-bottom: 20px; }
        .error-container h1 { color: #fca5a5; margin-bottom: 15px; }
        .error-container p { color: #9ca3af; margin-bottom: 25px; line-height: 1.6; }
        .error-msg {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 10px;
            padding: 15px;
            color: #fca5a5;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .btn-home {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .btn-home:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="icon">⚠️</div>
        <h1>Ha ocurrido un error</h1>
        <div class="error-msg" th:if="${error}" th:text="${error}"></div>
        <p>Si el problema persiste, contacte al administrador del sistema.</p>
        <a th:href="@{/home}" class="btn-home">Volver al Inicio</a>
    </div>
</body>
</html>
