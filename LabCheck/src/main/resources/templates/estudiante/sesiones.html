<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabCheck - Registro de Asistencia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .navbar {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .navbar h2 {
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-logout {
            padding: 8px 20px;
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.4);
            color: #fca5a5;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
        }
        .card h3 { margin-bottom: 20px; color: #c4b5fd; }
        .sesion-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        .sesion-card:hover { border-color: rgba(102,126,234,0.4); }
        .sesion-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sesion-header h4 { color: #a78bfa; }
        .sesion-meta { color: #9ca3af; font-size: 0.85rem; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .form-group { flex: 1; min-width: 180px; }
        .form-group label { display: block; margin-bottom: 6px; color: #aaa; font-size: 0.85rem; }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            background: rgba(255,255,255,0.07);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.25);
        }
        textarea { resize: vertical; min-height: 60px; font-family: inherit; }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102,126,234,0.4);
        }
        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; }
        .alert-success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
        .alert-error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .empty-state { text-align: center; padding: 40px; color: #6b7280; }
        .empty-state span { font-size: 3rem; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h2>LabCheck — Estudiante</h2>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button class="btn-logout">Cerrar Sesión</button>
        </form>
    </nav>

    <div class="container">
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="card">
            <h3>📝 Sesiones Activas — Registrar Asistencia</h3>

            <div th:if="${#lists.isEmpty(sesionesActivas)}" class="empty-state">
                <span>📭</span>
                <p>No hay sesiones de laboratorio activas en este momento.</p>
                <p style="font-size:0.85rem; margin-top:5px;">Espere a que su profesor active la sesión.</p>
            </div>

            <div th:each="sesion : ${sesionesActivas}" class="sesion-card">
                <div class="sesion-header">
                    <h4 th:text="${sesion.asignatura.nombre}">Asignatura</h4>
                    <span class="sesion-meta" th:text="'Sala: ' + ${sesion.sala.nombreCodigo}"></span>
                </div>
                <p class="sesion-meta" th:text="'Profesor: ' + ${sesion.profesor.nombres} + ' ' + ${sesion.profesor.apellidos}"></p>
                <p class="sesion-meta" style="margin-bottom:15px;" th:text="'Horario: ' + ${#temporals.format(sesion.horaInicio, 'HH:mm')} + ' - ' + ${#temporals.format(sesion.horaFin, 'HH:mm')}"></p>

                <form th:action="@{/estudiante/registrar-asistencia}" method="post">
                    <input type="hidden" name="sesionId" th:value="${sesion.id}">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Código de PC</label>
                            <input type="text" name="pcCodigo" placeholder="Ej: PC-01" required>
                        </div>
                        <div class="form-group">
                            <label>Novedades (opcional)</label>
                            <textarea name="novedades" placeholder="Reporte fallas del equipo..."></textarea>
                        </div>
                        <div class="form-group" style="flex:0;">
                            <label>&nbsp;</label>
                            <button type="submit" class="btn btn-primary">Registrar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
